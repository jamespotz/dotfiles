# Key Bindings - Niri-style configuration for Mango
# Mango uses different commands than hyprland!

# ============================================
# System
# ============================================
bind=SUPER+ALT,r,spawn,/home/jamespotz/.config/mango/bin/reload.sh
bind=SUPER+ALT,l,spawn,qs -c noctalia-shell ipc call lockScreen lock
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
bind=SUPER+SHIFT,f,spawn,sh -c "mmsg -g -c | wl-copy && notify-send 'Window Status Copied!'"

# ============================================
# Controller / Gaming
# ============================================
bind=SUPER,T,spawn,ghostty

# ============================================
# Applications (matching niri)
# ============================================
bind=SUPER,Return,spawn,kitty
bind=SUPER+CTRL,Return,spawn,kitty -T floating-kitty
bind=SUPER,Space,spawn,qs -c noctalia-shell ipc call launcher toggle

# App launchers
bind=SUPER,O,spawn,obs
bind=SUPER,Z,spawn,zed
bind=SUPER,B,spawn,helium
bind=SUPER+ALT,B,spawn,zen
bind=SUPER,F,spawn,nautilus

# Noctalia-specific binds
bind=SUPER+ALT,E,spawn,qs -c noctalia-shell ipc call launcher emoji
bind=SUPER+ALT,W,spawn,qs -c noctalia-shell ipc call wallpaper toggle
bind=ALT,D,spawn,qs -c noctalia-shell ipc call dock toggle

# ============================================
# Window Focus (SUPER + Arrows - like niri)
# ============================================
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ============================================
# Window Movement (SUPER + Shift + Arrows)
# ============================================
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Mouse Window Movement
axisbind=SUPER+ALT,UP,focusdir,left
axisbind=SUPER+ALT,DOWN,focusdir,right

# ============================================
# Workspace Navigation (Tags as Workspaces)
# ============================================
# Switch workspaces up/down
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0

# Move window to adjacent workspace
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0

# Mouse wheel workspace navigation
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright

# ============================================
# Workspaces (1-9) - Numbered tags
# SUPER+1-9 to view workspace 1-9, SUPER+SHIFT+1-9 to move window
# ============================================
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ============================================
# Monitor Navigation
# ============================================
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# ============================================
# Window States & Actions
# ============================================

# Window Resizing
bind=SUPER,equal,resizewin,5,0
bind=SUPER,minus,resizewin,-5,0
bind=SUPER+CTRL,equal,resizewin,0,5
bind=SUPER+CTRL,minus,resizewin,0,-5

bind=SUPER,V,togglefloating

# Toggle overview
bind=SUPER,X,toggleoverview,
bind=ALT,Tab,toggleoverview,
bind=SUPER,Tab,focusstack,next

# Fullscreen and maximize
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT,a,togglemaximizescreen,

# Minimize/restore
bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,

# Scratchpad
bind=ALT,z,toggle_scratchpad

# ============================================
# Screenshot
# ============================================
bind=SUPER+SHIFT,S,spawn,/home/jamespotz/.config/mango/bin/screenshot.sh

# ============================================
# Gaps & Layout
# ============================================
bind=CTRL,space,switch_layout
# bind=CTRL,s,setlayout,scroller
# bind=CTRL,d,setlayout,center_tile
# bind=CTRL,a,setlayout,tile

# Scroller layout
bind=SUPER+ALT,f,set_proportion,1.0
bind=ALT,space,switch_proportion_preset,

# Gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ============================================
# Mouse Button Bindings
# ============================================
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ============================================
# Axis Bindings (Mouse wheel)
# ============================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,qs -c noctalia-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,qs -c noctalia-shell ipc call volume muteOutput
bind=NONE,XF86MonBrightnessUp,spawn,qs -c noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,qs -c noctalia-shell ipc call brightness decrease

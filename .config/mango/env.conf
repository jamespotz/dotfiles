# Environment variables for non-mango items (waybar, noctalia, etc.)
# Note: Icon theme is handled by GTK settings files (~/.config/gtk-3.0/settings.ini)

# Include flatpak exports for icons and desktop files
# Full XDG_DATA_DIRS with flatpak paths prepended
env=XDG_DATA_DIRS,/home/jamespotz/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/home/jamespotz/.local/share:/usr/local/share:/usr/share

# Session type
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

#env=QT_SCALE_FACTOR,1

# env=QT_AUTO_SCREEN_SCALE_FACTOR,1
# env=QT_WAYLAND_FORCE_DPI,100
env=WLR_DRM_NO_ATOMIC,1

env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,qt6ct
env=ADW_DISABLE_PORTAL,1


include themes/helios.conf

# Font Configuration
font_size 12

# Window Configuration
hide_window_decorations yes
window_padding_width 12
background_opacity 1.0
background_blur 32

# Cursor Configuration
cursor_shape block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 3023

# Terminal features
copy_on_select no
confirm_os_window_close 0

# Shell integration
shell_integration enabled

# Key bindings for common actions
map ctrl+shift+n new_os_window
map ctrl+t new_tab
map ctrl+plus change_font_size current +1
map ctrl+minus change_font_size current -1
map ctrl+0 change_font_size current 0
map ctrl+h neighboring_window left
map ctrl+j neighboring_window top
map ctrl+k neighboring_window bottom
map ctrl+l neighboring_window right
map shift+enter send_text all \n

# Unfocused window dimming (closest match to unfocused-split-opacity)
inactive_text_alpha 0.7
